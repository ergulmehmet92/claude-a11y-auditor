<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scanner fixture: planted failures</title>
<style>
  body { font: 14px/1.4 sans-serif; margin: 16px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .clickable { cursor: pointer; padding: 4px 8px; background: #eee; display: inline-block; }
  #f-focus { outline: none; border: 1px solid #555; background: #fff; }
  #f-focus:focus { outline: none; }
  #f-hidden { opacity: 0; position: absolute; }
  .overlay { position: fixed; left: 0; top: 0; width: 100%; height: 60px; background: #333; color: #fff; z-index: 10; }
  #f-cover { position: fixed; left: 20px; top: 15px; z-index: 1; }
  .toolbar { display: flex; flex-wrap: nowrap; overflow: hidden; width: 100%; gap: 8px; }
  .toolbar button { flex: 0 0 auto; width: 140px; }
  .wide { width: 900px; background: #f5f5f5; }
  #f-spacing { height: 22px; width: 300px; overflow: hidden; white-space: normal; }
  main { margin-top: 70px; }
</style>
</head>
<body>
<div class="overlay">Overlay banner</div>
<button id="f-cover">Covered action</button>
<main>
  <h1 id="p-h1">Fixture</h1>
  <h2 id="p-h2">Section</h2>
  <h4 id="f-head">Skipped level</h4>

  <div class="row">
    <button id="p-btn">Open</button>
    <label for="p-input">Name</label><input id="p-input" type="text">
    <a id="p-link1" href="/docs">Docs</a> <a id="p-link2" href="/docs">Docs</a>
  </div>

  <div class="row"><div id="f-kbd" class="clickable" onclick="void 0">Save</div></div>
  <div class="row"><button id="f-name"><svg width="16" height="16" aria-hidden="true"><rect width="16" height="16"/></svg></button></div>
  <div class="row"><button id="f-lin" aria-label="Remove item">Delete</button></div>
  <div class="row"><span>Row A</span><button id="f-dup1">Edit</button></div>
  <div class="row"><span>Row B</span><button id="f-dup2">Edit</button></div>
  <div class="row"><input id="f-ph" type="text" placeholder="Search" aria-label="Search"></div>
  <div class="row"><div id="f-sel" role="combobox" tabindex="0" aria-label="Team role" aria-expanded="false" aria-controls="lb">Admin</div><ul id="lb" role="listbox" hidden></ul></div>
  <div class="row"><button id="f-focus">No focus style</button></div>
  <a id="f-hidden" href="/hidden">Hidden link</a>

  <div class="toolbar">
    <button id="p-tb1">First</button><button id="p-tb2">Second</button><button id="f-clip">Export report</button>
  </div>
  <div class="wide">Fixed-width panel</div>
  <div id="f-spacing">Status: all checks passed for this run</div>

  <div id="trap" class="row">
    <button id="f-trap1">Trap one</button><button id="f-trap2">Trap two</button>
  </div>
</main>
<script>
  // Planted keyboard trap: Tab on the last button wraps to the first, Shift+Tab on the first wraps to the last.
  const a = document.getElementById('f-trap1'), b = document.getElementById('f-trap2');
  b.addEventListener('keydown', (e) => { if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); a.focus(); } });
  a.addEventListener('keydown', (e) => { if (e.key === 'Tab' && e.shiftKey) { e.preventDefault(); b.focus(); } });
</script>
</body>
</html>
